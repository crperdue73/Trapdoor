# TRAPDOOR decoy site
#
# Deliberately boring. A decoy that looks interesting invites curiosity;
# a decoy that looks like an unmaintained internal server invites a scan
# and nothing more. We want the scanner, not the artist.

server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Default server: anything that doesn't match a vhost lands here.
    # That includes scanners hitting by raw IP, which is most of them.

    location / {
        try_files $uri $uri/ =404;
    }

    # Return a plausible-looking 404 rather than nginx's branded one.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # The classic scanner bait. Any hit here is a high-confidence signal:
    # nothing legitimate requests these paths.
    #
    # We serve a 403 instead of a 404 on purpose. A 404 tells the scanner
    # "not here, move on." A 403 tells it "exists but forbidden," which
    # keeps it engaged and keeps generating telemetry — and engagement is
    # the entire point of a decoy.
    location ~* ^/(\.env|\.git|\.svn|wp-login\.php|wp-admin|phpmyadmin|admin\.php|xmlrpc\.php|shell\.php|\.aws|\.ssh) {
        return 403;
    }

    # Bait path gets rate-limited so one student running a wordlist demo
    # cannot fill the disk in ninety seconds. The zone is declared in
    # nginx.conf (http context) because limit_req_zone is not valid here.
    location ~* ^/login {
        limit_req zone=trapdoor burst=20 nodelay;
        limit_req_status 429;
        return 401;
    }
}
