# TRAPDOOR web decoy — nginx
#
# Not a honeypot in the "emulate a vulnerable app" sense. This is a real
# web server doing real logging, which is the point: a Net+ student should
# see genuine nginx log lines and genuine HTTP status codes, not a fake.
#
# Two log streams:
#   /var/log/nginx/access.log  — combined format, the realistic one
#   /var/log/nginx/trapdoor.json — our structured stream, one JSON per request
#
# Both are volume-mounted to the shipper. The JSON stream is what gets
# normalized; the combined log is what students read with `tail -f`.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The realistic log. A student comparing `tail -f access.log` against
    # docs.nginx.com sees exactly what the docs describe.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Our structured stream. Keep the field names stable — the shipper
    # depends on them. escape=json means a payload with quotes or newlines
    # cannot break the line format, which matters because we are inviting
    # people to send us malicious input.
    log_format  trapdoor_json  escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"src_ip":"$remote_addr",'
            '"src_port":"$remote_port",'
            '"dst_port":"$server_port",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"protocol":"$server_protocol",'
            '"status":$status,'
            '"bytes_sent":"$body_bytes_sent",'
            '"user_agent":"$http_user_agent",'
            '"referer":"$http_referer",'
            '"host":"$host",'
            '"request_time":$request_time,'
            '"body_bytes":"$content_length"'
        '}';
        # Two rules learned the hard way, both of which produced a log the
        # shipper could not parse while the decoy looked perfectly healthy:
        #
        #  1. Numeric-looking nginx variables are EMPTY, not 0, when the value
        #     is not known. $body_bytes_sent on a GET is empty, and
        #     "$body_bytes_sent," with no `s` unit writes the literal text
        #     `"bytes_sent":,` - invalid JSON, every line, forever.
        #
        #  2. $content_length comes from the attacker's Content-Length header.
        #     Unquoted, a request with "Content-Length: 0}" injects a closing
        #     brace and forges fields into our structured log. It is attacker
        #     input, so it is quoted and goes through escape=json like every
        #     other string here. Nothing an attacker sends is ever written as
        #     JSON structure.
        #
        # body_bytes_sent therefore arrives as a STRING. shipper.py parses it
        # with as_int(), which returns None on anything unparseable - a
        # visible null, never a silent 0.

    access_log  /var/log/nginx/access.log  main;
    access_log  /var/log/nginx/trapdoor.json  trapdoor_json;

    sendfile        on;
    keepalive_timeout  65;

    # Do not advertise the version. An attacker fingerprinting us should
    # have to work for it. (This is also a Security+ teaching point:
    # banner disclosure is a finding in its own right.)
    server_tokens   off;

    # Cap request bodies. Unbounded uploads are how a decoy becomes a
    # disk-filling problem.
    client_max_body_size 1m;

    # Rate-limit zone for the bait paths, referenced by conf.d/default.conf.
    # Must live in http context — nginx rejects it inside a server block.
    # 10 requests/minute per source IP, 10 MB of state. Generous enough
    # that a normal scan is unaffected; tight enough that a wordlist
    # demo cannot run away with the disk.
    limit_req_zone $binary_remote_addr zone=trapdoor:10m rate=10r/m;

    include /etc/nginx/conf.d/*.conf;
}
