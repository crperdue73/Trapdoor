<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>404 Not Found</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 60px 20px;
    }
    .box {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 32px 36px;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 14px; }
    p { font-size: 14px; line-height: 1.6; color: #555; }
    .foot {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404 Not Found</h1>
    <p>The requested resource was not found on this server.</p>
    <div class="foot">nginx</div>
  </div>
</body>
</html>
