<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Internal Web Server</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 60px 20px;
    }
    .box {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 32px 36px;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 14px; }
    p { font-size: 14px; line-height: 1.6; color: #555; }
    code {
      background: #f0f0f0;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 13px;
    }
    .foot {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Internal Web Server</h1>
    <p>
      This server is not currently serving a public site.
      It may be under maintenance or awaiting configuration.
    </p>
    <p>
      If you reached this page unexpectedly, contact your local
      IT administrator and quote the address you used.
    </p>
    <div class="foot">
      nginx
    </div>
  </div>
</body>
</html>
