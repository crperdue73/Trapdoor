name: trapdoor

# TRAPDOOR core stack
# Cowrie (ssh/telnet) + nginx (web decoy) + shipper (normalizer)
#
# Safety rails are configured here, not left to the reader:
#   - no container has a path from captured payload to execution
#   - honeypots have no egress (internal: true)
#   - ports bind to LAB_BIND_IP so the lab network, not the world, reaches them

x-honeypot: &honeypot
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  cowrie:
    <<: *honeypot
    image: cowrie/cowrie:latest
    container_name: trapdoor-cowrie
    hostname: ${SENSOR_HOSTNAME:-web01}
    environment:
      COWRIE_TELNET_ENABLED: "true"
      COWRIE_SHELL_ENABLED: "true"
      # LLM mode is deliberately OFF: non-deterministic responses make
      # a class session unreproducible, which defeats the whole point.
      COWRIE_LLM_ENABLED: "false"
    volumes:
      - ./cowrie/etc/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/etc/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - cowrie_var:/cowrie/cowrie-git/var
    # NO published ports, deliberately.
    #
    # Cowrie is the one container that must never sit on a routed network:
    # it is the container an attacker actually gets a shell in. Publishing
    # 2222 here forced it onto labnet, and labnet gave it a route to the LAN.
    # The lab reaches it through the web container's network namespace
    # instead (web publishes the SSH ports and forwards them here), so the
    # decoy's ports are the only published ones and the interactive target
    # stays on the internal network.
    expose:
      - "2222"
      - "2223"
    tmpfs:
      - /tmp:size=64m
    networks:
      - honeynet

  web:
    image: nginx:stable-alpine
    container_name: trapdoor-web
    hostname: ${SENSOR_HOSTNAME:-web01}
    restart: unless-stopped
    depends_on:
      - firstboot
    security_opt:
      - no-new-privileges:true
    # nginx needs to bind :80 and write logs; drops everything else.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - ./web/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web/conf.d:/etc/nginx/conf.d:ro
      - ./web/html:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "${LAB_BIND_IP:-0.0.0.0}:${WEB_PORT:-8080}:80"
      # ssh + telnet to cowrie, forwarded rather than published on cowrie
      # itself. Publishing is what dragged cowrie onto labnet.
      - "${LAB_BIND_IP:-0.0.0.0}:${COWRIE_SSH_PORT:-2222}:2222"
      - "${LAB_BIND_IP:-0.0.0.0}:${COWRIE_TELNET_PORT:-2223}:2223"
    networks:
      - labnet
      - honeynet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot: nginx's image ships access.log and trapdoor.json as symlinks
  # to /dev/stdout. Our structured log has to be a real file on the shared
  # volume or the shipper cannot follow it. Replace the symlinks before
  # nginx ever starts.
  firstboot:
    image: busybox:stable
    container_name: trapdoor-firstboot
    restart: "no"
    command:
      - sh
      - -c
      - >
        rm -f /var/log/nginx/access.log /var/log/nginx/trapdoor.json;
        touch /var/log/nginx/access.log /var/log/nginx/trapdoor.json;
        chown -R 101:101 /var/log/nginx;
        echo "log volume prepared"
    volumes:
      - nginx_logs:/var/log/nginx
    networks:
      - honeynet

  shipper:
    <<: *honeypot
    build:
      context: ./shipper
    container_name: trapdoor-shipper
    depends_on:
      - cowrie
      - web
    environment:
      SENSOR_NAME: ${SENSOR_NAME:-lab-sensor-01}
      OUT_DIR: /out
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
    volumes:
      - cowrie_var:/in/cowrie:ro
      - nginx_logs:/in/nginx:ro
      - ./out:/out
    networks:
      - honeynet

networks:
  # Two networks, because one could not do both jobs.
  #
  # This bit us on the first real deployment: containers were all up and
  # healthy, the web decoy answered 200 on its container IP, and NOTHING
  # could reach it from the host. No error, no warning - Docker simply does
  # not publish ports from a container whose only network is internal,
  # because publishing a port means routing to the outside and we had told
  # it there was no outside. The stack looked fine and was unreachable.
  #
  # So: inbound reachability and outbound containment are separate networks.
  #   labnet   - NOT internal. Carries the published ports only.
  #   honeynet - internal, as before. Carries container-to-container traffic
  #              and is the reason a compromised decoy has no route out.
  #
  # The honeypot is attached to both. It can be reached from the lab.
  #
  # CORRECTION, and it cost a deployment to learn: "publishing a port does not
  # open an egress path" was WRONG. I wrote it in a commit message and then
  # wrote a check that could not run, so nothing ever contradicted me. When
  # the check was finally made to run it reported:
  #
  #   FAIL  cowrie REACHED the LAN - internal:true is not in effect
  #
  # It reached it through labnet. A multi-homed container picks a default
  # route by interface order, and Docker attaches the non-internal network
  # with the lower metric. So the moment cowrie joined labnet to make its
  # port publishable, it gained a way out. Inbound and egress are the same
  # pipe once the container sits on a routed network.
  #
  # The port only needs to exist on the DECOY, which is a static nginx that
  # does not take instructions. Cowrie's SSH listener needs no published port
  # at all: the lab reaches it through the web container's network, and it
  # stays on the internal network where it belongs.
  labnet:
    driver: bridge
  honeynet:
    driver: bridge
    # No route to the outside. A honeypot that can reach the internet is
    # a pivot waiting to happen, and everything it needs is in its image.
    internal: true

volumes:
  cowrie_var:
  nginx_logs:
