# TRAPDOOR — Cowrie configuration
#
# Medium-interaction: an emulated shell, not a real one. An attacker who gets
# "in" is talking to a Python fake filesystem. Nothing they type executes.
#
# Overriding only what matters. Everything else inherits the image default so
# an upstream change does not silently break us.

[honeypot]

# NOTE: there is no [honeypot] share_path in this image at all. Cowrie's
# shipped cowrie.cfg.dist has no [honeypot] section, and this image keeps its
# data under the package directory, not under share/:
#
#   fs.pickle  ->  /cowrie/cowrie-git/src/cowrie/data/fs.pickle
#
# An earlier version of this file used \${honeypot:share_path}/fs.pickle,
# copied from an older Cowrie layout, and it did not fail at load time. It
# failed the moment a session started, as an interpolation error, after a
# successful login. Paths here are absolute for that reason: a path that is
# checked against the image cannot drift out of date the way a path that is
# remembered can.

# The hostname the attacker sees. Boring on purpose: a decoy called "honeypot"
# is a decoy nobody attacks.
hostname = web01

# How long a session may idle before Cowrie closes it. Keeps a stray student
# connection from holding resources all afternoon.
session_timeout = 300

# --- Listeners -------------------------------------------------------------
#
# Both bind inside the container. The host side is mapped in compose.yml and
# bound to LAB_BIND_IP, so the lab network reaches these and nothing else does.

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
# A plausible Debian version string. An attacker fingerprinting us should see
# an ordinary box, not a honeypot's default banner.
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u2
# Accept uploads over SFTP/SCP so the transfer is captured and can be hashed.
sftp_enabled = true

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

# --- Shell behaviour -------------------------------------------------------

[shell]
# Paths are absolute and checked against the image by verify.sh. An earlier
# version interpolated ${honeypot:share_path}, copied from an older Cowrie
# layout. Cowrie's shipped config has no [honeypot] section at all, and a
# config file replaces a section rather than merging into it, so nothing
# resolved it - and it failed only when a session started, after a
# successful login. A remembered path drifts; a checked one cannot.

filesystem = /cowrie/cowrie-git/src/cowrie/data/fs.pickle
# The fake Debian filesystem that ships with Cowrie. Students can `ls /etc`,
# `cat /etc/passwd`, and explore - all of it fabricated.

# processes is DELIBERATELY NOT SET.
#
# It is a JSON file (the image's cmdoutput.json) holding canned command
# output, not a list of commands and not a pickle. Two earlier versions of
# this file pointed it at fs.pickle, which is a binary pickle. Cowrie opened
# it as UTF-8 and died:
#
#   UnicodeDecodeError: 'utf-8' codec can't decode byte 0x80 in position 0
#
# after a successful login, at the moment the shell started. Leaving the key
# out means Cowrie falls back to its own bundled cmdoutput.json, which is
# correct by construction and cannot drift.


# --- Auth ------------------------------------------------------------------
#
# The choice here is a teaching decision, not a technical one:
#
#   accept = true   any username/password gets in. The attacker reaches the
#                   shell immediately. Good for a shell-interaction lesson,
#                   useless for a brute-force lesson because there is nothing
#                   to brute-force.
#
#   accept = false  only credentials in userdb.txt work. The attacker has to
#                   try, which means every failed attempt is logged and
#                   students get a real credential-stuffing transcript.
#
# DEFAULT IS false. A brute-force lesson with `accept = true` teaches nothing.
# Change this per lesson, and remember to change it back.
auth_class = UserDB
auth_class_parameters = /cowrie/cowrie-git/etc/userdb.txt

# --- Uploads ---------------------------------------------------------------
#
# Payloads are collected so students can examine them, hashed by the shipper,
# and NEVER executed. There is no code path from this directory to anything
# that runs.

[downloads]
enabled = true
# Attackers often try to download their tooling first. Let them, and log it.

# --- Output ----------------------------------------------------------------

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
# ISO timestamps so the shipper does not have to convert, and so a student
# reading the raw log sees a human-readable time.

[output_textlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.log

# --- Sessions --------------------------------------------------------------

# Save full session transcripts (TtyLog) so a session can be replayed and
# shown to a class. This is the single most useful artifact for teaching.
[ttylog]
enabled = true
